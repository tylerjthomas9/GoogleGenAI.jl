name: JET
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/JET.yml'
      - 'src/**'
      - 'Project.toml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jet:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    continue-on-error: true # full-package analysis still has known false positives; triage before removing this
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: JET static analysis
        run: |
          julia --color=yes -e '
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.develop(; path=".")
          Pkg.add("JET")
          using JET, GoogleGenAI
          report_package(GoogleGenAI)'
